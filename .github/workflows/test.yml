name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The hooks branch on the platform (Windows paths, PowerShell statusline,
    # O_NOFOLLOW off Windows), so every supported OS runs the suite.
    # Job-level, so test code never holds the codecov job's id-token.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Python deps for correctness and manifest checks
        run: python -m pip install --only-binary=':all:' --require-hashes --requirement .github/ci/requirements.txt

      - name: Check Rust tooling
        working-directory: tools
        # pwsh on Windows checks only the last command's exit code.
        shell: bash
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Check rule copies
        run: cargo run --locked --quiet --manifest-path tools/Cargo.toml -- sync --check

      - name: Check version consistency
        run: cargo run --locked --quiet --manifest-path tools/Cargo.toml -- check-versions

      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        run: npm test

      # The same suites as npm test, in one runner so a single lcov report
      # covers both. Coverage is reported only; there is no threshold.
      - name: Run tests with line coverage
        if: matrix.os == 'ubuntu-latest'
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-exclude='tests/**' --test-coverage-exclude='pi-extension/test/**'
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=coverage.lcov
          tests/*.test.js pi-extension/test/*.test.js

      - name: Keep the coverage report for the Codecov upload
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-node
          path: coverage.lcov
          retention-days: 1

      - name: Run benchmark selftest
        run: python benchmarks/agentic/run.py --selftest

  # The upload runs apart from the tests so the OIDC token is never available
  # while test code runs.
  codecov:
    name: upload coverage to Codecov
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A Codecov outage must not turn the tests badge red.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-node
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage.lcov
          disable_search: true
          fail_ci_if_error: true

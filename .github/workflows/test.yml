name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    # The hooks branch on the platform (Windows paths, PowerShell statusline,
    # O_NOFOLLOW off Windows), so every supported OS runs the suite.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Python deps for correctness and manifest checks
        run: python -m pip install pandas pyyaml

      - name: Check Rust tooling
        working-directory: tools
        # pwsh on Windows checks only the last command's exit code.
        shell: bash
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Check rule copies
        run: cargo run --locked --quiet --manifest-path tools/Cargo.toml -- sync --check

      - name: Check version consistency
        run: cargo run --locked --quiet --manifest-path tools/Cargo.toml -- check-versions

      - name: Run tests
        run: npm test

      - name: Run benchmark selftest
        run: python benchmarks/agentic/run.py --selftest

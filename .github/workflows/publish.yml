name: publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
    # A called workflow's jobs cannot request more than its caller grants, and
    # a job requesting more stops the run starting, so test.yml's codecov job
    # needs id-token here even though it skips this workflow_dispatch run.
    # test.yml's test job declares contents: read itself, so the grant never
    # reaches test code.
    permissions:
      contents: read
      id-token: write # Only test.yml's codecov job requests it.

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@11.5.1
      # No token: id-token: write above lets npm authenticate via OIDC, and
      # provenance is attached automatically. access set in publishConfig.
      - run: npm publish
